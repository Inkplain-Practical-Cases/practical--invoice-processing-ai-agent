name: Validate all seven invoice learning branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    name: pytest on ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch:
          - step-01-receive-and-read-pdf-invoices
          - step-02-extract-structured-invoice-data
          - step-03-validate-invoice-business-rules
          - step-04-integrate-postgresql-storage
          - step-05-handle-duplicates-and-processing-errors
          - step-06-harden-and-verify
          - main
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout selected learning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install branch dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit and PostgreSQL HTTP integration tests
        env:
          DATABASE_URL: postgresql+psycopg://invoice:invoice@localhost:5432/invoice_db
        run: python -m pytest -q
