# Local educational PostgreSQL; never deploy these example credentials publicly.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_db"]
      interval: 3s
      retries: 15
